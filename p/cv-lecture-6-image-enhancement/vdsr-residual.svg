<svg xmlns="http://www.w3.org/2000/svg" width="380" height="420" viewBox="0 0 380 420" role="img" aria-labelledby="title desc">
  <title id="title">VDSR 残差学习</title>
  <desc id="desc">插值图像经过卷积网络得到预测残差，再与原插值图像逐像素相加，得到高分辨率预测。</desc>
  <rect width="380" height="420" rx="12" fill="#f8fafc"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs>
  <g fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arrow)">
    <path d="M190 70V99"/><path d="M190 150V179"/><path d="M190 230V267"/><path d="M190 312V349"/>
    <path d="M290 45H335V290H214"/>
  </g>
  <g fill="#e6eff6" stroke="#a5b8c7">
    <rect x="90" y="20" width="200" height="50" rx="7"/>
    <rect x="90" y="100" width="200" height="50" rx="7"/>
    <rect x="90" y="180" width="200" height="50" rx="7"/>
    <rect x="90" y="350" width="200" height="50" rx="7"/>
    <circle cx="190" cy="290" r="22"/>
  </g>
  <g fill="#182d3d" font-family="Microsoft YaHei, sans-serif" font-size="16" text-anchor="middle">
    <text x="190" y="51">插值图像</text><text x="190" y="131">卷积网络</text>
    <text x="190" y="211">预测残差</text><text x="190" y="381">高分辨率预测</text>
    <text x="190" y="298" font-size="26">+</text>
    <text x="112" y="297" font-size="14">逐像素相加</text>
  </g>
</svg>
